name: Build Develop Branch Image

on:
  push:
    branches:
      - develop

permissions:
  contents: read

# Only the newest development build should publish the mutable dev tag.
concurrency:
  group: deploy-develop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and publish development image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Development

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rtl-application:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/rtl-application:dev
          build-args: |
            NEXT_PUBLIC_CAPTCHA_SITE_KEY=${{ vars.NEXT_PUBLIC_CAPTCHA_SITE_KEY }}
            NEXT_PUBLIC_ENVIRONMENT=${{ vars.NEXT_PUBLIC_ENVIRONMENT }}
            NEXT_PUBLIC_MAPBOX_TOKEN=${{ vars.NEXT_PUBLIC_MAPBOX_TOKEN }}
            NEXT_PUBLIC_ORIGIN_URL=${{ vars.NEXT_PUBLIC_ORIGIN_URL }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}

      - name: Re-enable daily E2E monitoring
        env:
          GH_TOKEN: ${{ secrets.E2E_REPO_TOKEN }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::E2E_REPO_TOKEN is not configured."
            exit 1
          fi

          payload="$(jq -n --arg sha "$IMAGE_SHA" '{
            event_type: "dev_image_published",
            client_payload: { image_sha: $sha }
          }')"

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/RateTheLandlord/rtl-e2e-tests/dispatches \
            -d "$payload"
