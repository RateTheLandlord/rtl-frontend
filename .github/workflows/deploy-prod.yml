name: Build and Push Production Docker Image

on:
  push:
    branches:
      - production # Trigger on pushes to the production branch

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build and push
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rtl-application:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/rtl-application:latest
          build-args: |
            NEXT_PUBLIC_CAPTCHA_SITE_KEY=6LcRITMoAAAAAATL4j2kghgihjbGbBK3kT8sLne9
            NEXT_PUBLIC_ENVIRONMENT=production
            NEXT_PUBLIC_GMAPS_TOKEN=AIzaSyBIeYDExBBrO7TSTxRb8XTVroOAdPY487Y
            NEXT_PUBLIC_MAPBOX_TOKEN=pk.eyJ1IjoicmF0ZXRoZWxhbmRsb3JkIiwiYSI6ImNsejhka2EzaTAxeXUyanExdHU2OHlubXQifQ.9VNuTN1NkaE9TYhIaVkJUA
            NEXT_PUBLIC_ORIGIN_URL=https://ratethelandlord.org
            NEXT_PUBLIC_POSTHOG_HOST=https://eu.i.posthog.com
