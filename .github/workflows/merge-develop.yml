name: Pull Request

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Lint, test, type-check, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint:merge

      - name: Test
        run: bun run test:ci

      - name: Type-check
        run: bun run tsc

      - name: Build
        run: npm run build
        env:
          # API routes instantiate the OpenAI client during Next.js build analysis.
          # The build does not make API requests, so a placeholder is sufficient.
          OPENAI_API_KEY: ci-build-placeholder
