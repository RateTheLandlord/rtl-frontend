name: Develop Pull Request

on:
  pull_request:
    branches: ['develop']

permissions:
  contents: read

jobs:
  validate:
    name: Lint, test, type-check, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint:merge

      - name: Test
        run: bun run test:merge

      - name: Type-check
        run: bun run tsc

      - name: Build
        run: bun run build
