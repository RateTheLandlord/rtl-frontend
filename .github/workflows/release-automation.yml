name: Release Automation

on:
  schedule:
    - cron: '0 12 * * 5' # Runs every Friday at 12:00 UTC
  workflow_dispatch: # Allows manual triggering

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ensure all commits, branches, and tags are fetched

      - name: Determine latest version (published or pending)
        id: latest_version
        run: |
          # Find latest tag
          LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || echo "v0.0.0")

          # Find latest release branch
          LATEST_BRANCH=$(git branch -r | grep -oE 'release-[0-9]+\.[0-9]+' | sort -V | tail -n 1 || echo "")

          # Extract numeric versions
          TAG_VERSION="${LATEST_TAG//v/}" # Remove "v" prefix
          BRANCH_VERSION="${LATEST_BRANCH//release-/}" # Remove "release-" prefix

          # Determine highest version
          if [ -z "$BRANCH_VERSION" ] || [ "$(printf '%s\n%s' "$TAG_VERSION" "$BRANCH_VERSION" | sort -V | tail -n 1)" = "$TAG_VERSION" ]; then
            BASE_VERSION=$TAG_VERSION
          else
            BASE_VERSION=$BRANCH_VERSION
          fi

          # Increment minor version
          IFS='.' read -r -a PARTS <<< "$BASE_VERSION"
          NEW_TAG="v${PARTS[0]}.$((PARTS[1] + 1)).0"

          echo "Latest tag: $LATEST_TAG"
          echo "Latest branch: $LATEST_BRANCH"
          echo "New version: $NEW_TAG"

          echo "new_tag=$NEW_TAG" >> $GITHUB_ENV

      - name: Create release branch
        run: |
          NEW_BRANCH="release-${{ env.new_tag }}"
          git checkout -b $NEW_BRANCH origin/develop
          git push origin $NEW_BRANCH

      - name: Generate changelog
        id: changelog
        run: |
          LAST_TAG=${{ env.new_tag }}

          if [ "$LAST_TAG" == "v0.0.0" ]; then
            # First release, list all commits
            CHANGELOG=$(git log --pretty=format:"- %s (%an)")
          else
            # List commits since the last tag
            CHANGELOG=$(git log $LAST_TAG..HEAD --pretty=format:"- %s (%an)")
          fi

          echo "Changelog: $CHANGELOG"
          echo "changelog<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create draft release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.new_tag }}
          release_name: 'Release ${{ env.new_tag }}'
          draft: true
          prerelease: false
          body: |
            ## Changes in ${{ env.new_tag }}

            ${{ env.changelog }}

      - name: Store release ID
        run:
          echo "release_id=${{ steps.create_release.outputs.id }}" >>
          $GITHUB_ENV

  cleanup-old-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and delete old release branches
        run: |
          OLD_RELEASE=$(git branch -r | grep "origin/release-" | tail -n 1 | sed 's/origin\///')
          if [ -n "$OLD_RELEASE" ]; then
            echo "Deleting old release branch: $OLD_RELEASE"
            git push origin --delete $OLD_RELEASE || echo "Branch already deleted"
          else
            echo "No old release branches found"
          fi

      - name: Delete old draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASES=$(gh release list --json tagName | jq -r '.[] | select(.tagName | test("v[0-9]+\\.[0-9]+\\.[0-9]+")) | .tagName')
          if [ -n "$RELEASES" ]; then
            LATEST_RELEASE=$(echo "$RELEASES" | tail -n 1)
            echo "Deleting old draft release: $LATEST_RELEASE"
            gh release delete "$LATEST_RELEASE" --yes
          else
            echo "No draft releases found"
          fi
        shell: bash
