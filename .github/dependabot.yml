version: 2

updates:
  # Application dependencies managed by Bun.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      bun-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # Versions of GitHub Actions used by workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      github-actions-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # Base images referenced by the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      docker-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
